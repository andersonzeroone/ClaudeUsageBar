<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>ClaudeUsageBar — menu bar icon and dropdown (illustrative mockup, not a live screenshot)</title>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4150"/>
      <stop offset="100%" stop-color="#20232b"/>
    </linearGradient>
    <filter id="panelShadow" x="-40%" y="-20%" width="180%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- desktop backdrop -->
  <rect x="0" y="0" width="680" height="430" rx="14" fill="url(#backdrop)"/>

  <!-- menu bar -->
  <rect x="0" y="0" width="680" height="40" rx="14" fill="#141416"/>
  <rect x="0" y="14" width="680" height="26" fill="#141416"/>

  <!-- generic system icons (left of ours) -->
  <g fill="#e7e7ea" opacity="0.75">
    <path d="M486 16 a14 14 0 0 1 20 0 l-3 3 a10 10 0 0 0 -14 0 z" />
    <path d="M490 21 a8 8 0 0 1 12 0 l-3 3 a4 4 0 0 0 -6 0 z" />
    <circle cx="496" cy="27" r="1.6"/>
    <rect x="518" y="16" width="20" height="10" rx="2.5" fill="none" stroke="#e7e7ea" stroke-width="1.3"/>
    <rect x="539" y="19" width="1.6" height="4" fill="#e7e7ea"/>
    <rect x="520" y="18" width="12" height="6" rx="1" fill="#e7e7ea"/>
  </g>

  <!-- our status item, highlighted as "open" -->
  <rect x="560" y="6" width="72" height="28" rx="6" fill="#ffffff" opacity="0.16"/>
  <g transform="translate(568,12)">
    <circle cx="8" cy="8" r="8.5" fill="none" stroke="#f2f2f4" stroke-width="1.4"/>
    <path d="M2.5 12 A8 8 0 0 1 13.5 12" fill="none" stroke="#f2f2f4" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="8" y1="8" x2="12.5" y2="4.2" stroke="#f2f2f4" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="8" cy="8" r="1.2" fill="#f2f2f4"/>
  </g>
  <text x="590" y="24" font-size="14" font-weight="600" fill="#f2f2f4" font-variant-numeric="tabular-nums">42%</text>

  <!-- dropdown panel -->
  <g filter="url(#panelShadow)">
    <rect x="352" y="48" width="280" height="300" rx="12" fill="#2b2b2e" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <g font-size="13" fill="#f2f2f4">
    <text x="370" y="76" font-weight="600" font-size="14">Ada Lovelace</text>
    <text x="370" y="96" font-size="12" fill="#a9a9ae">ada@example.com</text>
    <text x="370" y="114" font-size="12" fill="#a9a9ae">Org: Example Org</text>
    <text x="370" y="132" font-size="12" fill="#a9a9ae">Plan: Max 5x</text>

    <line x1="364" y1="144" x2="620" y2="144" stroke="#ffffff" stroke-opacity="0.12"/>

    <text x="370" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <tspan fill="#f2f2f4">Session (5h)  </tspan><tspan fill="#5ec269">████████</tspan><tspan fill="#5a5a5e">░░░░</tspan><tspan fill="#f2f2f4">  42%</tspan>
    </text>
    <text x="376" y="183" font-size="12" fill="#a9a9ae">resets in 2h15m (at 18:30)</text>

    <line x1="364" y1="195" x2="620" y2="195" stroke="#ffffff" stroke-opacity="0.12"/>

    <text x="370" y="217" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <tspan fill="#f2f2f4">Weekly (7d)  </tspan><tspan fill="#5ec269">███</tspan><tspan fill="#5a5a5e">█████████</tspan><tspan fill="#f2f2f4">  15%</tspan>
    </text>
    <text x="376" y="234" font-size="12" fill="#a9a9ae">resets in 4d (at Mon 09:00)</text>

    <line x1="364" y1="246" x2="620" y2="246" stroke="#ffffff" stroke-opacity="0.12"/>

    <text x="370" y="266" font-size="12" fill="#a9a9ae">Updated at 14:32:10</text>

    <text x="370" y="290" font-size="13">Language</text>
    <path d="M602 285 l5 4 l-5 4" fill="none" stroke="#a9a9ae" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="356" y="300" width="272" height="24" rx="4" fill="#0a84ff"/>
    <text x="370" y="317" font-size="13" fill="#ffffff">Refresh now</text>

    <line x1="364" y1="336" x2="620" y2="336" stroke="#ffffff" stroke-opacity="0.12"/>

    <text x="370" y="358" font-size="13">Quit</text>
  </g>
</svg>
